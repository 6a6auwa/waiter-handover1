<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8">
<title>Передача смены 6-12-24</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4f5f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:560px;margin:auto;padding:18px 14px 40px}.eyebrow{font-size:13px;color:#6d6d75}.title{font-size:28px;font-weight:800;margin:4px 0}.sub{color:#777;margin-bottom:24px}
h2{font-size:13px;color:#5f6068;margin:22px 4px 10px}.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.shift{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.shift input,.yn input{display:none}.pill{display:flex;align-items:center;justify-content:center;min-height:44px;background:#f0f1f5;border-radius:12px;font-weight:700}
input:checked+.pill{background:#2481cc;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-top:10px}
label.cap{display:block;font-size:12px;color:#666;margin:0 0 5px}input[type=text],input[type=date],input[type=time],textarea{width:100%;border:0;background:#f1f2f6;border-radius:12px;padding:13px;font-size:16px;outline:none}
.item-title{font-weight:750;margin-bottom:10px}.num{font-size:11px;color:#777;margin-right:7px}.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo{margin-top:9px}.photo input{width:100%;font-size:14px}.preview{display:flex;gap:6px;overflow:auto;margin-top:8px}.preview img{height:64px;width:64px;object-fit:cover;border-radius:9px}
textarea{min-height:90px;resize:vertical}.btn{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800;margin-top:10px;cursor:pointer}.primary{background:#2481cc;color:#fff}.secondary{background:#fff;color:#111;border:1px solid #ddd}
.status{text-align:center;font-size:14px;margin:12px 4px;min-height:20px}.ok{color:#16863b}.err{color:#c62828}
.note{font-size:12px;color:#777;line-height:1.4;margin-top:8px}
@media(max-width:380px){.wrap{padding-left:10px;padding-right:10px}.title{font-size:25px}}
@media print{body{background:white}.wrap{max-width:none;padding:0}.btn,.photo input,.note{display:none}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">6-12-24 • Telegram Mini App</div>
  <div class="title">Передача смены</div>
  <div class="sub">Официанты • контроль • фотофиксация</div>

  <h2>СМЕНА</h2>
  <div class="card">
    <div class="shift">
      <label><input type="radio" name="shift" value="Дневная"><span class="pill">Дневная</span></label>
      <label><input type="radio" name="shift" value="Вечерняя"><span class="pill">Вечерняя</span></label>
      <label><input type="radio" name="shift" value="Полная"><span class="pill">Полная</span></label>
    </div>
    <div class="grid">
      <div class="field"><label class="cap">Дата</label><input id="date" type="date"></div>
      <div class="field"><label class="cap">Время</label><input id="time" type="time"></div>
    </div>
    <div class="field"><label class="cap">Официант, сдающий смену</label><input id="employeeOut" type="text" placeholder="ФИО"></div>
    <div class="field"><label class="cap">Официант, принимающий смену</label><input id="employeeIn" type="text" placeholder="ФИО"></div>
    <div class="field"><label class="cap">Менеджер смены</label><input id="manager" type="text" placeholder="ФИО"></div>
  </div>

  <h2>КОНТРОЛЬ ПЕРЕДАЧИ</h2>
  <div id="checks"></div>

  <h2>КОММЕНТАРИЙ</h2>
  <div class="card"><textarea id="comment" placeholder="Комментарий к передаче смены"></textarea></div>

  <button id="sendBtn" class="btn primary">ПЕРЕДАТЬ СМЕНУ</button>
  <button class="btn secondary" onclick="window.print()">СОХРАНИТЬ В PDF</button>
  <div id="status" class="status"></div>
  <div class="note">Фото отправляются вместе с передачей смены. На бесплатном Render первая отправка после простоя может занять до минуты.</div>
</div>
<script>
const API="https://waiter-handover.onrender.com/handover";
const items=[
 ["envelopes","Бумажные конверты"],
 ["dishes","Посуда натёрта"],
 ["pillows","Подушки поправлены"],
 ["condiments","Кондименты пополнены"],
 ["cleaning","Уборка выполнена"],
 ["bread","Хлеб в наличии"],
 ["napkins","Скрученные салфетки в наличии"],
 ["station","Официантский стейшин чистый"],
 ["kidsChairs","Детские стулья чистые"],
 ["pencils","Карандаши наточены"]
];
const checks=document.getElementById("checks");
items.forEach(([key,title],i)=>{
 const el=document.createElement("div"); el.className="card";
 el.innerHTML=`<div class="item-title"><span class="num">${String(i+1).padStart(2,"0")}</span>${title}</div>
 <div class="yn">
 <label><input type="radio" name="${key}" value="Да"><span class="pill">Да</span></label>
 <label><input type="radio" name="${key}" value="Нет"><span class="pill">Нет</span></label>
 </div>
 <div class="photo"><label class="cap">📷 Фотофиксация</label>
 <input type="file" name="photo_${key}" accept="image/*" capture="environment" multiple onchange="preview(this,this.nextElementSibling)">
 <div class="preview"></div></div>`;
 checks.appendChild(el);
});
function preview(inp,box){box.innerHTML="";[...inp.files].slice(0,4).forEach(f=>{let im=document.createElement("img");im.src=URL.createObjectURL(f);box.appendChild(im)})}
function pad(n){return String(n).padStart(2,"0")}
function initDate(){const d=new Date();document.getElementById("date").value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;document.getElementById("time").value=`${pad(d.getHours())}:${pad(d.getMinutes())}`}
initDate();
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand()}
function val(name){return document.querySelector(`input[name="${name}"]:checked`)?.value||""}
function payload(){
 let c={};items.forEach(([k,t])=>c[k]={title:t,value:val(k)});
 return {date:date.value,time:time.value,shift:val("shift"),employeeOut:employeeOut.value.trim(),employeeIn:employeeIn.value.trim(),manager:manager.value.trim(),comment:comment.value.trim(),checks:c,telegramInitData:tg?.initData||""}
}
function validate(d){
 if(!d.shift)return "Выберите смену";
 if(!d.date||!d.time)return "Укажите дату и время";
 if(!d.employeeOut)return "Укажите сдающего официанта";
 if(!d.employeeIn)return "Укажите принимающего официанта";
 if(!d.manager)return "Укажите менеджера смены";
 for(const [k,t] of items) if(!d.checks[k].value)return `Отметьте «Да/Нет»: ${t}`;
 return "";
}
document.getElementById("sendBtn").onclick=async()=>{
 const d=payload(),e=validate(d),st=document.getElementById("status"),btn=document.getElementById("sendBtn");
 if(e){st.className="status err";st.textContent=e;tg?.HapticFeedback?.notificationOccurred("error");return}
 if(!d.telegramInitData){st.className="status err";st.textContent="Откройте приложение кнопкой Open App внутри Telegram";return}
 const fd=new FormData();fd.append("payload",JSON.stringify(d));
 document.querySelectorAll('input[type=file]').forEach(inp=>[...inp.files].forEach(f=>fd.append("photos",f,f.name)));
 btn.disabled=true;btn.textContent="ОТПРАВКА…";st.className="status";st.textContent="Передаём данные и фотографии…";
 try{
   const r=await fetch(API,{method:"POST",body:fd});const j=await r.json().catch(()=>({}));
   if(!r.ok||!j.ok)throw new Error(j.error||`Ошибка ${r.status}`);
   st.className="status ok";st.textContent="✓ Смена успешно передана в Telegram";
   tg?.HapticFeedback?.notificationOccurred("success");
   tg?.showAlert?.("Смена успешно передана");
 }catch(x){st.className="status err";st.textContent="Не удалось отправить: "+x.message;tg?.HapticFeedback?.notificationOccurred("error")}
 finally{btn.disabled=false;btn.textContent="ПЕРЕДАТЬ СМЕНУ"}
};
</script>
</body></html>
